<html>
<head></head>
<body bgcolor="teal">
<h1><i><center>HEADING</center></i></h1>
<script>
var a="Hello";
var b="world";
var c="Welcome";
var d=a+b+c;
var e=prompt("enter your string : ");
document.write("<h2>STRING FUNCTIONS</h2><br><br>");
document.write("STRING 1 : "+a+"<br>");
document.write("STRING 2 : "+b+"<br>");
document.write("STRING 3 : "+c+"<br>");
document.write("FINAL STRING : "+d+"<br><br>");

document.write( "<h3>string function<h3><br><br>");
document.write("entered string : "+e+"<br>");
document.write("Uppercase : "+e.toUpperCase()+"<br>");
document.write("Lowercase : "+e.toLowerCase()+"<br>");
document.write("Replace : "+e.replace("Hello","Hellooo")+"<br>");
document.write("Slice : "+e.slice(1,3)+"<br><br>");

document.write("<h3>Math function</h3><br><br>");
document.write("Square : "+Math.sqrt(4)+"<br>");
document.write("Power : "+Math.pow(2,3)+"<br>");
document.write("Absolute value : "+Math.abs(-2)+"<br>");
document.write("Round : "+Math.round(2.5689)+"<br>");
document.write("Floor : "+Math.floor(2.6476528)+"<br>");
document.write("Ceil : "+Math.ceil(2.64759752)+"<br><br>");
</script>
</body>
</html>
