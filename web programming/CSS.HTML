<!DOCTYPE html>
<html>
<head><title>css example</title>
<link rel="stylesheet" href="external.css">
<style>
.internal{
background-color: red;
padding: 15px;
border: 2px dashed black;
}
h1{
color: yellow;
text-align: center;
}
</style>
</head>
<body>
<h1>css styling</h1>
<div class="internal">
<h2>this is internal css</h2>
</div>
<br>
<h2 style="color: pink; background-color: blue;">this is inline css</h2>
</body>
</html>
